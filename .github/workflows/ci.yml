name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "Validate on Node ${{ matrix.node-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gates
        run: pnpm release:check

  collector-harness:
    name: "Mailbox access collector harness (PowerShell 7.6)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same pinned PowerShell as the collector image (Dockerfile).
      - name: Install PowerShell 7.6.10
        run: |
          wget -q -O /tmp/packages-microsoft-prod.deb https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades "powershell=7.6.10-1.deb"
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Run collect.ps1 against mocked Exchange cmdlets
        run: pwsh -NoProfile -NonInteractive -File apps/email-worker/container/m365-perms/collect.Tests.ps1

      - name: Check the onboarding scripts (mocked az, Wrangler and Exchange)
        run: pwsh -NoProfile -NonInteractive -File scripts/onboarding/onboarding.Tests.ps1
